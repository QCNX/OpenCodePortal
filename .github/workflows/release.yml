name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.2.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and test
        run: pnpm exec tsc --noEmit && pnpm test

      - name: Build
        run: pnpm build

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Gateway image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          IMAGE="ghcr.io/qcnx/opencode-portal-gateway"
          docker build --provenance=false -f Dockerfile.gateway \
            -t "${IMAGE}:latest" -t "${IMAGE}:v${VERSION}" -t "${IMAGE}:v${MAJOR}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:v${VERSION}"
          docker push "${IMAGE}:v${MAJOR}"

      - name: Build and push Agent image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          IMAGE="ghcr.io/qcnx/opencode-portal-agent"
          docker build --provenance=false -f Dockerfile.agent \
            -t "${IMAGE}:latest" -t "${IMAGE}:v${VERSION}" -t "${IMAGE}:v${MAJOR}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:v${VERSION}"
          docker push "${IMAGE}:v${MAJOR}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
