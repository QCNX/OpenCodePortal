# OpenCode Portal — standalone deployment with pre-built image
#
# Usage:
#   1. cp data/config.yaml.example data/config.yaml && edit data/config.yaml
#   2. cp .env.example .env && fill OIDC_CLIENT_ID / OIDC_CLIENT_SECRET
#   3. docker compose -f docker-compose.gateway.yml up -d
#   4. Open http://localhost:8080/
#
# Release images are published to GitHub Container Registry on GitHub tag releases.
# Use a versioned image tag for production deployments.

services:
  gateway:
    image: ghcr.io/qcnx/opencode-portal-gateway:latest
    container_name: ocp-portal
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORTAL_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
